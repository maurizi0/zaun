[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:squid]
command=/usr/sbin/squid --foreground -f /etc/squid/squid.conf
autorestart=true
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cachelog]
; mirror squid's cache.log to the container log
command=/usr/bin/tail -n0 -F /var/log/agent-proxy/cache.log
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:ulogd]
command=/usr/sbin/ulogd -c /etc/agent-proxy/ulogd.conf
autostart=%(ENV_ULOGD_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:webui]
command=/usr/bin/python3 -m uvicorn agentproxy.main:app --host %(ENV_UI_LISTEN)s --port %(ENV_UI_PORT)s --no-access-log
directory=/opt/agent-proxy
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
