# agent-proxy base configuration. The access policy lives in the generated
# include below and is rewritten by the web UI on every rule change.

http_port 3128 ssl-bump tls-cert=/data/ca/ca.pem tls-key=/data/ca/ca.key generate-host-certificates=on dynamic_cert_mem_cache_size=16MB
sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/agent-proxy/ssl_db -M 16MB
sslcrtd_children 8 startup=1 idle=1

# bump (decrypt) every TLS connection so method + path can be filtered and logged
acl step1 at_step SslBump1

cache_effective_user agentproxy
cache_effective_group agentproxy
pid_filename /run/agent-proxy/squid.pid
coredump_dir /var/spool/squid
cache deny all
cache_mem 8 MB
pinger_enable off

logformat agentproxy %ts.%03tu %>a %rm %Ss %>Hs %<a %{rule}note %ru
access_log stdio:/var/log/agent-proxy/access.log agentproxy
logfile_rotate 0
cache_log /var/log/agent-proxy/cache.log
strip_query_terms on

via off
forwarded_for delete
httpd_suppress_version_string on
shutdown_lifetime 2 seconds

include /run/agent-proxy/squid-rules.conf

# Bind permissions to the original CONNECT before reading client TLS SNI.
# ap_ws_bind visits every matching rule, including overlapping allow rules.
ssl_bump peek step1 ap_mark_bumped ap_ws_bind
ssl_bump bump all
